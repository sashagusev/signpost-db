<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>SIGNPOST</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3v18M8 21h8' stroke='%23161616'/%3E%3Cpath d='M5 6h11l3 2.5-3 2.5H5z' stroke='%23c4573a'/%3E%3Cpath d='M19 13H8l-3 2.5L8 18h11z' stroke='%232f6aa3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centred column (max 1040px) under a hairline top bar; instrument style: IBM Plex Sans throughout, Plex Mono figures, square controls, hairline rules */
:root{
  --bg:#ffffff; --ink:#161616; --soft:#393939; --muted:#6f6f6f; --faint:#a8a8a8; --rule:#e0e0e0; --wash:#f4f4f4; --frame:#8d8d8d; --field:#f4f4f4;
  --up:#c4573a; --up-wash:#f7e6e0; --down:#2f6aa3; --down-wash:#e3ecf5; --hl:#fcf4d6;
  --c-eq:#1f78b4; --c-tw:#3f8d87; --c-smr:#b0563f; --c-bz:#c9922a; --c-pq:#7b5ea7; --c-cd:#4a4a4a; --c-min:#1f4e79; --c-new:#c4573a;
  --serif:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif; --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif; --mono:"IBM Plex Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161616; --ink:#f4f4f4; --soft:#c6c6c6; --muted:#a8a8a8; --faint:#6f6f6f; --rule:#393939; --wash:#262626; --frame:#6f6f6f; --field:#262626;
  --up:#e2876c; --up-wash:#3a241d; --down:#6ea3d6; --down-wash:#1d2a37; --c-eq:#62a8e6; --c-tw:#6fc0b8; --c-smr:#e08b74; --c-bz:#e3b55a; --c-pq:#a98bd6; --c-cd:#b8b8b8; --c-min:#9cc3ea; --c-new:#e2876c; --hl:#3d3416; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161616; --ink:#f4f4f4; --soft:#c6c6c6; --muted:#a8a8a8; --faint:#6f6f6f; --rule:#393939; --wash:#262626; --frame:#6f6f6f; --field:#262626;
  --up:#e2876c; --up-wash:#3a241d; --down:#6ea3d6; --down-wash:#1d2a37; --c-eq:#62a8e6; --c-tw:#6fc0b8; --c-smr:#e08b74; --c-bz:#e3b55a; --c-pq:#a98bd6; --c-cd:#b8b8b8; --c-min:#9cc3ea; --c-new:#e2876c; --hl:#3d3416; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,tr:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.top{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:24px;padding-block:12px;border-bottom:1px solid var(--rule)}
.wordmark{font-size:15px;font-weight:600;letter-spacing:.06em;display:inline-flex;align-items:center;gap:9px}
.wordmark .logo{width:22px;height:22px;flex:none}
.wordmark small{font-family:var(--sans);font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:10px;vertical-align:3px}
.top .sbox{margin-left:auto;width:min(340px,48vw)}
main{max-width:1040px;margin:0 auto;padding-block:72px 120px;min-height:60vh}
.kicker{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kicker a{border-bottom:1px solid var(--rule)} .kicker a:hover{color:var(--ink)}
h1{font-weight:500;font-size:clamp(28px,4vw,40px);line-height:1.15;letter-spacing:-.015em;margin:12px 0 0;max-width:20ch;text-wrap:balance}
h2{font-weight:600;font-size:18px;line-height:1.2;margin:0 0 6px;text-wrap:balance}
.dek{font-size:16px;line-height:1.5;color:var(--soft);max-width:36em;margin:18px 0 0}
.note{font-size:13px;color:var(--muted);max-width:40em}
.sec{margin-top:88px}
.sec > .note{margin:0 0 26px}
.sec.row{display:grid;grid-template-columns:280px minmax(0,1fr);column-gap:60px;align-items:start;border-top:1px solid var(--rule);padding-top:34px;margin-top:52px}
.sec.row .fig{margin-top:0}.sec.row .note{margin:0 0 16px}.sec.row .rt .ctl{display:flex;flex-direction:column;gap:10px;align-items:flex-start;margin-top:4px}.sec.row .rt .cap{font-size:12px;color:var(--muted);margin:14px 0 0}.sec.row > p{margin:0;font-size:14px}
.sec.row.full{display:block}.sec.row.full h2{margin-bottom:24px}
.fig.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}.fig.pair .kicker{margin-bottom:10px}
.up{color:var(--up)} .down{color:var(--down)} .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.94em}
/* search */
.sbox{position:relative}
.sbox input{width:100%;border:0;border-bottom:1px solid var(--frame);background:var(--field);color:var(--ink);font-family:var(--sans);font-size:14px;padding:7px 10px;border-radius:0;outline-offset:0}
.sbox input::placeholder{color:var(--faint)}
.sbox.big input{font-size:clamp(17px,2.2vw,20px);padding:12px 14px;border-bottom:1px solid var(--ink)}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--bg);border:1px solid var(--rule);border-top:0;max-height:360px;overflow:auto}
.sugg a{display:flex;gap:12px;align-items:baseline;padding:9px 12px;font-size:14px;border-bottom:1px solid var(--rule)}
.sugg a.on,.sugg a:hover{background:var(--wash)}
.sugg .t{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);width:44px;flex:none}
.sugg .m{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
/* key */
.key{display:flex;flex-wrap:wrap;gap:10px 28px;font-size:13px;color:var(--soft);margin-top:40px;padding-top:18px;border-top:1px solid var(--rule)}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
/* home */
.howto{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;margin-top:20px}
.howto div{border-top:2px solid var(--ink);padding-top:12px}
.howto b{display:block;font-size:28px;font-weight:500;line-height:1.1}
.howto span{font-size:13px;color:var(--muted)}
.cols{columns:2 320px;column-gap:56px;margin-top:8px}
.cat{break-inside:avoid;margin:0 0 30px}
.cat h3{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.cat a{display:flex;gap:12px;padding:4px 0;font-size:14px}
.cat a:hover .n{color:var(--ink);text-decoration:underline}
.cat a .c{margin-left:auto;color:var(--faint);font-size:12px}
.tabs{display:inline-flex;flex-wrap:wrap;padding-left:1px}
.chip{font:inherit;font-size:12.5px;border:1px solid var(--frame);border-radius:0;margin-left:-1px;height:30px;padding:0 13px;color:var(--ink);background:var(--bg);cursor:pointer}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg);position:relative}
.chip:hover:not(.on){background:var(--wash)}
.filters{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:0 0 26px}
.filters .chip{padding:0 10px}
.filters.one{flex-wrap:nowrap;gap:8px 12px;white-space:nowrap}.filters.one .chip{padding:0 7px}.filters.one .lab{letter-spacing:.06em;margin-right:0}.filters.one > span{display:inline-flex;align-items:center;gap:5px;flex:none}.filters.one .tabs{flex-wrap:nowrap}
@media (max-width:1100px){.filters.one{flex-wrap:wrap}}
.filters .lab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:2px}
/* answer page */
.answer{font-weight:500;font-size:clamp(28px,3.8vw,40px);line-height:1.18;letter-spacing:-.015em;margin:14px 0 0;max-width:22ch;text-wrap:balance}
.answer .g{font-weight:600}
.meter{max-width:560px;margin-top:44px}
.track{position:relative;height:2px;background:var(--rule);margin:34px 0 8px}
.track .zone{position:absolute;top:-6px;height:14px;background:var(--wash)}
.track .pin{position:absolute;top:-8px;width:2px;height:18px;background:var(--ink)}
.track .pinlab{position:absolute;top:-34px;transform:translateX(-50%);font-size:13px;font-weight:600;white-space:nowrap}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:56px;max-width:860px}
.facts div{border-top:1px solid var(--ink);padding-top:10px}
.facts b{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.facts span{font-size:14px;color:var(--soft)}
.evrow{display:grid;grid-template-columns:170px 120px minmax(0,1fr) 150px;gap:16px;align-items:center;padding:13px 0;border-bottom:1px solid var(--rule);font-size:14px}
.evrow.head{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--ink);padding-top:0}
.evrow .s{font-weight:600}
.evrow .s em{font-style:normal;font-weight:500;font-size:11px;color:var(--muted);display:block;letter-spacing:.02em}
.evrow.none{color:var(--faint)}
.evrow.call{border-bottom:1px solid var(--ink)}
.evrow.sub{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;min-height:49px;box-sizing:border-box}
.evrow.oth .s{font-weight:500;color:var(--muted)}
.evrow.ct.more{display:block;color:var(--muted)}
.evrow.ot{grid-template-columns:minmax(0,1fr) 84px 166px 118px 118px 116px 76px;gap:14px}
.evrow.ot:not(.head) > :nth-child(n+4){white-space:nowrap}
.sec .meter{margin:26px 0 44px}
.evrow.ot .var{font-size:13px;color:var(--soft)}
.evrow.ot .pl{display:none;font-style:normal}
.evrow.ot .var em{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.shap{padding:6px 0 18px 186px;border-bottom:1px solid var(--rule)}
.shead,.srow{display:grid;grid-template-columns:minmax(0,260px) 76px minmax(0,1fr);gap:14px;align-items:center}
.shead{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-bottom:6px}
.shead .sax{display:flex;justify-content:space-between;letter-spacing:.02em;text-transform:none;font-weight:500}
.srow{padding:5px 0;font-size:13px;color:var(--soft)}
.sl{min-width:0}.sl em{font-style:normal;font-size:10.5px;color:var(--muted);margin-left:7px;white-space:nowrap}
.sv{color:var(--muted);font-size:12.5px}
.sbar{position:relative;height:12px}
.sbar:before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--frame)}
.sbar i{position:absolute;top:2px;height:8px}
.sbar i.conf{background:var(--ink)} .sbar i.unc{background:var(--faint)}
.snote{font-size:11.5px;color:var(--muted);margin:10px 0 0}
.axis{position:relative;height:16px}
.axis:before{content:"";position:absolute;left:0;right:0;top:8px;height:1px;background:var(--rule)}
.axis .z{position:absolute;top:2px;height:13px;background:var(--wash);left:0}
.axis b{position:absolute;top:3px;width:11px;height:11px;border-radius:50%;transform:translateX(-50%);border:1.5px solid var(--bg)}
.fn{max-width:680px;margin-top:16px}
.fnt{margin:0;font-size:14.5px;line-height:1.6;color:var(--soft)}
.fnt.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fnm{display:flex;gap:18px;margin-top:6px;font-size:12px}
.lk{font:inherit;font-size:12px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;border-bottom:1px solid var(--rule)}
.lk:hover{color:var(--ink)}
.xc{font-size:12px;white-space:nowrap;color:var(--soft)} .xc.all{color:var(--ink);font-weight:500} .xc.none{color:var(--up)}
.tnav{display:flex;gap:18px;font-size:13px}.tnav a{color:var(--muted)}.tnav a:hover{color:var(--ink)}
.ab p{max-width:44em;color:var(--soft);font-size:15px;line-height:1.65;margin:0 0 14px}
.ab dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 24px;max-width:860px;margin:0;font-size:14px}
.ab dt{font-weight:600}.ab dd{margin:0;color:var(--soft)}
.fig{margin-top:22px}.fig .ctl{display:flex;gap:18px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.fig .legend svg{display:inline-block;width:12px;height:12px}
.fig .cap{font-size:12px;color:var(--muted);margin-top:8px;max-width:60em}
.aucg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.aucg h4{font-size:13px;font-weight:600;margin:0 0 4px}.aucg h4 span{font-weight:400;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--soft);margin-top:10px}.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}
.dsum{margin-top:12px}.dsum p{margin:0 0 6px;font-size:13.5px;color:var(--soft);max-width:60em}.dsum b{color:var(--ink);font-weight:600}.dsum .dcap{font-size:12px;color:var(--muted)}
.rx{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;line-height:14px;padding:0 5px;border:1px solid var(--ink);color:var(--ink);margin-left:8px;vertical-align:1px}
.rx.ap{background:var(--ink);color:var(--bg)}
.drugs{margin-top:26px;max-width:620px;font-size:13px}
.drugs .dh{display:flex;align-items:center;gap:10px;color:var(--soft);padding-bottom:8px;border-bottom:1px solid var(--ink)}
.drugs .dr{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 110px;gap:12px;padding:6px 0;border-bottom:1px solid var(--rule)}
.drugs .dr span:nth-child(2){color:var(--muted)} .drugs .dr.more{color:var(--muted);border-bottom:0}
.axis .dl{position:absolute;top:0;font-size:11.5px;line-height:16px;color:var(--soft);white-space:nowrap}
.cand{display:grid;grid-template-columns:150px minmax(0,1fr) 52px 90px 80px 170px;gap:14px;align-items:center;padding:11px 0 11px 12px;border-bottom:1px solid var(--rule);font-size:14px}
.cand > span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand.head{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--ink);padding-top:0}
.cand.me{background:linear-gradient(90deg,var(--wash),transparent)}
.cand a.gl{font-weight:600;border-bottom:1px solid var(--rule)}
.pbar{height:6px;background:var(--rule);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--soft)}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 12px 10px 0;border-bottom:1px solid var(--ink);vertical-align:bottom;white-space:nowrap}
th.sortable{cursor:pointer} th.sortable:hover{color:var(--ink)} th.sorted{color:var(--ink)}
td{padding:10px 12px 10px 0;border-bottom:1px solid var(--rule);vertical-align:middle}
tbody tr{cursor:pointer} tbody tr:hover td{background:var(--wash)}
td.gn{font-weight:600;white-space:nowrap}
.lx{font:inherit;font-family:var(--mono);font-size:11px;font-weight:500;line-height:16px;height:18px;min-width:26px;padding:0 5px;margin-left:8px;border:1px solid var(--frame);border-radius:0;background:var(--bg);color:var(--soft);cursor:pointer;vertical-align:1px}
td.lxc{width:1%;white-space:nowrap} td.lxc .lx{margin-left:0}
.lx:hover,.lx[aria-expanded="true"]{border-color:var(--ink);color:var(--ink)}
tr.sub td.gn{padding-left:30px;font-weight:500;box-shadow:inset 2px 0 0 var(--frame)} tr.sub td{background:var(--wash)}
th:first-child,td:first-child{padding-left:12px} td.dir{white-space:nowrap;font-size:13px}
.dotax{position:relative;width:130px;height:14px}
.dotax:before{content:"";position:absolute;left:0;right:0;top:7px;height:1px;background:var(--rule)}
.dotax:after{content:"";position:absolute;left:40%;top:2px;width:1px;height:11px;background:var(--frame)}
.dotax b{position:absolute;top:2px;width:10px;height:10px;border-radius:50%;background:var(--ink);transform:translateX(-50%)}
.mbar{display:flex;align-items:center;gap:8px}.mbar .pbar{width:64px}.mbar span{font-size:12px;color:var(--muted);width:30px}
.ev{display:flex;gap:4px}
.ev i{width:14px;height:14px;border-radius:0;display:block;border:1px solid transparent}
.ev i.no{border-color:var(--rule);background:transparent}
.ev i.ch{outline:1.5px solid var(--ink);outline-offset:1px}
.evh{display:flex;gap:4px}
.evh span{width:14px;line-height:14px;font-size:9px;letter-spacing:0;text-transform:none;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);height:46px;text-align:left;font-weight:500}
.more{margin-top:22px}
.btn{font:inherit;font-size:13px;border:1px solid var(--ink);background:var(--bg);color:var(--ink);padding:7px 16px;border-radius:0;cursor:pointer}
.btn:hover{background:var(--wash)}
.evkey{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;font-size:12.5px;color:var(--muted);margin:-8px 0 26px}
.evkey .ev{display:inline-flex}
/* gene profile */
.prof svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--sans);fill:var(--soft)}
svg .tl{font-size:12.5px} svg .tiny{font-size:10.5px;fill:var(--muted)}
svg .row:hover .bgr{fill:var(--wash)}
svg .row{cursor:pointer}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--bg);border:1px solid var(--frame);box-shadow:0 4px 18px rgba(0,0,0,.08);padding:8px 11px;font-size:12.5px;line-height:1.45;max-width:280px;color:var(--soft)}
#tip b{color:var(--ink)}
/* graph page */
.gwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;column-gap:32px;border-top:1px solid var(--ink);padding-top:14px}
.gstage{position:relative} #gcv{width:100%;display:block;cursor:grab;touch-action:none} #gcv.pt{cursor:pointer}
.gstat{font-size:12px;color:var(--muted);height:20px}
.gzoom{position:absolute;right:0;top:0;display:flex;z-index:2} .gzoom button{font:inherit;font-size:14px;line-height:1;width:28px;height:28px;margin-left:-1px;border:1px solid var(--frame);border-radius:0;background:var(--bg);color:var(--ink);cursor:pointer} .gzoom button:hover{background:var(--wash)}
.gkey{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12px;color:var(--muted);margin-top:10px} .gkey i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px} .gkey b{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:-1px}
.gside{font-size:13px;max-height:740px;overflow:auto} .gside h2{font-size:16px} .gsub{color:var(--muted);font-size:12px;margin:0 0 10px} .gbtn{font-size:12px;padding:4px 10px;margin:0 6px 12px 0}
.grow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 2px;border:0;border-bottom:1px solid var(--rule);border-radius:0;width:100%;text-align:left;font:inherit;font-size:13px;color:inherit;background:none;cursor:pointer}
.grow:hover{background:var(--wash)} .grow em{font-style:normal;color:var(--muted);font-size:11.5px;display:block}
.gfp{display:inline-grid;grid-auto-flow:column;gap:2px} .gfp i{width:8px;height:14px;border:1px solid var(--rule);display:block}

  s+=`<text x="${ml+pw/2}" y="${H-6}" class="tiny" text-anchor="middle">${esc(cfg.xl)}</text><text transform="translate(12 ${mt+ph/2}) rotate(-90)" class="tiny" text-anchor="middle">${esc(cfg.yl)}</text>`;

function aboutPage(){

    else{const L=E.filter(p=>p.t===n.t).sort((a,b)=>b.j-a.j);
      S.innerHTML=`<button class="btn gbtn" data-back>Hub genes</button><button class="btn gbtn" data-pin="${n.t}">Only this trait</button><h2><a class="gl" href="${link("t",TT[n.t].id)}">${esc(n.name)}</a></h2><p class="gsub">${esc(TT[n.t].cohort)} · ${esc(GGRP[n.grp][0])} · ${L.length} genes at this score</p>`+
        L.slice(0,150).map(p=>`<a class="grow" href="${link("p",TT[n.t].id,gid(p.g))}"><span>${arr(p.s)} <b>${esc(gname(p.g))}</b></span><span class="num" style="color:var(--muted)">${p.j.toFixed(2)}</span></a>`).join("")}}
  const pins=()=>{const a=[...st.pins]; $("#gpins").innerHTML=a.slice(0,6).map(t=>`<button class="gpin" data-t="${t}">${esc(TT[t].name)} <span style="color:var(--muted)">${esc(TT[t].cohort)}</span> ×</button>`).join("")+(a.length>6?`<span class="gpin" style="cursor:default;border-color:var(--rule)">and ${a.length-6} more</span>`:"")+(a.length?`<button class="gpin" data-t="all">Clear</button>`:"")};
  const addPins=ts=>{ts.forEach(t=>st.pins.add(+t)); if(st.pins.size<3&&st.mn>1) setChip("#gmn","mn",1); pins(); build()};
  const setChip=(id,key,v)=>{st[key]=v; $(id).querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",String(x.dataset.v)===String(v)))};
  const pick=ev=>{const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left-W/2-tf.x)/tf.k,y=(ev.clientY-r.top-H/2-tf.y)/tf.k; let best=null,bd=1e9; for(const n of nodes){const d=Math.hypot(n.x-x,n.y-y)-n.r; if(d<bd){bd=d;best=n}} return best&&bd<5/tf.k?best:null};
  // genes with the same pattern as the selected gene (same direction on 90%+ of at least five shared traits) and with the opposite pattern (10% or less)
  const partners=g=>{const me=new Map(GS.get(g).tr.map(p=>[p.t,p.s])),tw=[],mi=[]; GS.forEach(x=>{if(x.g===g||x.tr.length<5) return; let n=0,same=0; const gr=new Set(); for(const p of x.tr){const s0=me.get(p.t); if(s0===undefined) continue; n++; if(s0===p.s) same++; gr.add(TT[p.t].grp)} if(n<5) return; const c=same/n,o={g:x.g,n,ng:gr.size,c}; if(c>=.9) tw.push(o); else if(c<=.1) mi.push(o)});
    const ord=(a,b)=>b.ng-a.ng||b.n-a.n; return {tw:tw.sort(ord),mi:mi.sort(ord)}};
  const select=n=>{st.sel=n; PT=new Map(); PL={tw:[],mi:[]}; if(n&&n.kind==="g"){PL=partners(n.g); PL.tw.slice(0,8).forEach(o=>PT.set(o.g,1)); PL.mi.slice(0,8).forEach(o=>PT.set(o.g,-1))} side(); draw()};
  for(const [id,key,conv] of [["#gth","th",Number],["#gmn","mn",Number],["#gun","unit",String]]) $(id).addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return; setChip(id,key,conv(b.dataset.v)); build()});
  $("#ggr").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return; const g=+b.dataset.g; st.grp.has(g)?st.grp.delete(g):st.grp.add(g); if(!st.grp.size) st.grp=new Set(GGRP.map((_,i)=>i)); $("#ggr").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",st.grp.has(+x.dataset.g))); build()});
  $("#ggr").addEventListener("dblclick",e=>{const b=e.target.closest("button"); if(!b) return; st.grp=new Set([+b.dataset.g]); $("#ggr").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",st.grp.has(+x.dataset.g))); build()});
  const ts=$("#gts"),sr=$("#gres"); ts.addEventListener("input",()=>{const q=ts.value.trim().toLowerCase(); if(q.length<2){sr.hidden=true;return} const m=TT.filter(t=>t.name.toLowerCase().includes(q)).slice(0,14); sr.hidden=!m.length; sr.innerHTML=m.map(t=>`<div data-t="${t.i}">${esc(t.name)} <em>${esc(t.cohort)}</em></div>`).join("")});
  sr.addEventListener("click",e=>{const d=e.target.closest("div[data-t]"); if(!d) return; ts.value=""; sr.hidden=true; addPins([d.dataset.t])}); ts.addEventListener("blur",()=>setTimeout(()=>{sr.hidden=true},180));
  $("#gpins").addEventListener("click",e=>{const p=e.target.closest("button[data-t]"); if(!p) return; p.dataset.t==="all"?st.pins.clear():st.pins.delete(+p.dataset.t); pins(); build()});
  $("#gside").addEventListener("click",e=>{if(e.target.closest("[data-back]")) return select(null); const li=e.target.closest("[data-list]"); if(li){st.list=li.dataset.list; return side()} if(e.target.closest("[data-ob]")){st.ob=!st.ob; return side()} const pn=e.target.closest("[data-pin]"); if(pn) return addPins(pn.dataset.pin.split(","));
    const g=e.target.closest("button[data-g]"); if(!g) return; let n=nodes.find(n=>n.kind==="g"&&n.g===+g.dataset.g); if(!n){st.extra.add(+g.dataset.g); build(); n=nodes.find(n=>n.kind==="g"&&n.g===+g.dataset.g)} if(n) select(n)});
  let drag=null; cv.addEventListener("pointerdown",ev=>{drag={x:ev.clientX,y:ev.clientY,tx:tf.x,ty:tf.y,moved:false}; cv.setPointerCapture(ev.pointerId)});
  cv.addEventListener("pointermove",ev=>{const tp=$("#tip"); if(drag){const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y; if(Math.hypot(dx,dy)>4) drag.moved=true; if(drag.moved){tf.x=drag.tx+dx; tf.y=drag.ty+dy; tp.hidden=true; draw()} return}
    const n=pick(ev); cv.classList.toggle("pt",!!n); if(n!==st.hov){st.hov=n; draw()} if(!n){tp.hidden=true;return}
    if(n.kind==="g"){const x=GS.get(n.g); tp.innerHTML=`<b>${esc(n.name)}</b><br>${x.tr.length} traits in ${x.grp.size} groups<br>${x.up} raised, ${x.dn} lowered`} else tp.innerHTML=`<b>${esc(n.name)}</b><br>${esc(TT[n.t].cohort)} · ${esc(GGRP[n.grp][0])}<br>${n.deg} genes shown`; tp.hidden=false});
  cv.addEventListener("pointerup",ev=>{const d=drag; drag=null; if(d&&!d.moved) select(pick(ev))}); cv.addEventListener("pointerleave",()=>{if(st.hov){st.hov=null; draw()} $("#tip").hidden=true});
  const zoom=(f,cx=0,cy=0)=>{const k=Math.min(8,Math.max(.5,tf.k*f)),q=k/tf.k; tf.x=cx-(cx-tf.x)*q; tf.y=cy-(cy-tf.y)*q; tf.k=k; draw()};
  cv.addEventListener("wheel",ev=>{if(!(ev.ctrlKey||ev.metaKey)) return; ev.preventDefault(); const r=cv.getBoundingClientRect(); zoom(Math.exp(-ev.deltaY*.01),ev.clientX-r.left-W/2,ev.clientY-r.top-H/2)},{passive:false});
  document.querySelector(".gzoom").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return; +b.dataset.z?zoom(+b.dataset.z):(tf={x:0,y:0,k:1},draw())});
  const onRes=()=>{if(!document.body.contains(cv)) return removeEventListener("resize",onRes); size(); build()}; addEventListener("resize",onRes);
  size(); pins(); build()}
function route(){const h=decodeURIComponent(location.hash.slice(1)); window.scrollTo(0,0); $("#tip").hidden=true;
  if(h==="about") return aboutPage();
  if(h==="graph") return graphPage();
  if(h.startsWith("t_")&&tIdx.has(h.slice(2))) return traitPage(tIdx.get(h.slice(2)));
  if(h.startsWith("g_")&&gIdx.has(h.slice(2))) return genePage(gIdx.get(h.slice(2)));
  if(h.startsWith("p_")){const [tt,gg]=h.slice(2).split("~"); if(tIdx.has(tt)&&gIdx.has(gg)) return pairPage(tIdx.get(tt),gIdx.get(gg))}
  home()}
// tooltip
document.addEventListener("mouseover",e=>{const el=e.target.closest("[data-tip]"),tp=$("#tip"); if(!el){tp.hidden=true;return} tp.innerHTML=el.dataset.tip; tp.hidden=false});
document.addEventListener("mousemove",e=>{const tp=$("#tip"); if(tp.hidden) return; const x=Math.min(e.clientX+14,innerWidth-tp.offsetWidth-8),y=e.clientY+16+tp.offsetHeight>innerHeight?e.clientY-tp.offsetHeight-10:e.clientY+16; tp.style.left=x+"px"; tp.style.top=y+"px"});

fetch("core.json?v="+BUILD).then(r=>{if(!r.ok) throw new Error(r.status); return r.json()}).then(d=>{D=d;
  byT=D.traits.map(()=>[]); D.pairs.forEach(a=>{byT[a[0]].push(a); if(!byG.has(a[1])) byG.set(a[1],[]); byG.get(a[1]).push(a); pairKey.set(a[0]+"|"+a[1],a)});
  D.traits.forEach((T,i)=>tIdx.set(T.id,i)); D.genes.forEach((G,i)=>{if(byG.has(i)||!gIdx.has(G[0])) gIdx.set(G[0],i)});
  wireSearch($("#topsearch")); addEventListener("hashchange",route); route()})
 .catch(err=>{app.innerHTML=`<h1>The data did not load</h1><p class="dek">data.json could not be read (${esc(err.message)}). Reload the page to try again.</p>`});
</script>
</body>
